services:
  knowledge-vault:
    image: knowledge-vault:latest
    build: .
    container_name: knowledge-vault
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      # Bind-mount the TrueNAS-backed NFS vault directly into the container.
      # Source of truth lives on TrueNAS dataset tank/vault; Git history and
      # Syncthing replication are handled on the host, not inside this
      # container. The old named volume `ai-knowledge_vault-data` is
      # preserved untouched for a later data-migration session — do NOT
      # `docker volume rm` it.
      - /mnt/vault:/data/vault
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VAULT_DIR=/data/vault
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-30}
      - VAULT_AUTH_TOKEN=${VAULT_AUTH_TOKEN:-}
      - VAULT_ALLOWED_ORIGINS=${VAULT_ALLOWED_ORIGINS:-}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}

  # ProtonMail Bridge — IMAP access to vault@stratusfinance.co.za
  # After first start: docker exec -it protonmail-bridge bash
  #   Then: /protonmail/proton-bridge --cli --noninteractive
  #   > login vault@stratusfinance.co.za  (enter password + 2FA)
  #   > info  (copy the Bridge IMAP password)
  protonmail-bridge:
    image: shenxn/protonmail-bridge:3.0.21-1
    container_name: protonmail-bridge
    restart: unless-stopped
    environment:
      - PROTONMAIL_BRIDGE_DISABLE_UPDATES=1
    volumes:
      - bridge-data:/root
    profiles:
      - email

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vault-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - knowledge-vault
    profiles:
      - tunnel

volumes:
  bridge-data:
