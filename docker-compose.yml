services:
  knowledge-vault:
    image: knowledge-vault:latest
    build: .
    container_name: knowledge-vault
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - vault-data:/data/vault
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VAULT_DIR=/data/vault
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-30}
      - VAULT_AUTH_TOKEN=${VAULT_AUTH_TOKEN:-}
      - VAULT_ALLOWED_ORIGINS=${VAULT_ALLOWED_ORIGINS:-}

  # ProtonMail Bridge — IMAP access to vault@stratusfinance.co.za
  protonmail-bridge:
    image: shenxn/protonmail-bridge
    container_name: protonmail-bridge
    restart: unless-stopped
    volumes:
      - bridge-data:/root
    profiles:
      - email

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vault-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - knowledge-vault
    profiles:
      - tunnel

volumes:
  vault-data:
    external: true
    name: ai-knowledge_vault-data
  bridge-data:
