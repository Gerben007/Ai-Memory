services:
  knowledge-vault:
    image: knowledge-vault:latest
    build: .
    container_name: knowledge-vault
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - vault-data:/data/vault
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VAULT_DIR=/data/vault
      # Set AUTH_PASSWORD in .env to require a login screen. Strongly
      # recommended when exposing the vault to the internet. Leave blank for
      # local-only open access.
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-30}

volumes:
  vault-data:
    external: true
    name: ai-knowledge_vault-data
