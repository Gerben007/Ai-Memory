services:
  knowledge-vault:
    image: knowledge-vault:latest
    build: .
    container_name: knowledge-vault
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      # Bind-mount the TrueNAS-backed NFS vault directly into the container.
      # Source of truth lives on TrueNAS dataset tank/vault; Git history and
      # Syncthing replication are handled on the host, not inside this
      # container. The old named volume `ai-knowledge_vault-data` is
      # preserved untouched for a later data-migration session — do NOT
      # `docker volume rm` it.
      - /mnt/vault:/data/vault
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VAULT_DIR=/data/vault
      # Remote MCP bearer token (required for /mcp endpoint). Leave unset to
      # disable; /mcp will return 503.
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}

  # Cloudflare Tunnel — exposes vault externally via your domain
  # To set up:
  #   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/get-started/
  #   2. Run: cloudflared tunnel login
  #   3. Run: cloudflared tunnel create knowledge-vault
  #   4. Copy the tunnel token
  #   5. Set CLOUDFLARE_TUNNEL_TOKEN in .env or replace below
  #   6. In Cloudflare Zero Trust dashboard, add a public hostname
  #      pointing to your tunnel (e.g. vault.yourdomain.com → http://knowledge-vault:3001)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vault-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - knowledge-vault
    profiles:
      - tunnel
